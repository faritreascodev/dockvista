name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m ./cmd/... ./internal/... ./pkg/...

  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/... ./internal/... ./pkg/...
      - run: go test ./cmd/... ./internal/... ./pkg/... -race -cover
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Vulnerability scan
        # Two Moby findings (GO-2026-4887, GO-2026-4883) have no upstream fix
        # yet. The scan still runs so the report is visible; it does not fail
        # the job until those are patched in github.com/docker/docker.
        continue-on-error: true
        run: govulncheck ./cmd/... ./internal/... ./pkg/...

  frontend:
    name: Lint & typecheck (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Go binary embeds web/dist via go:embed, so the frontend must be
      # built before `go build` regardless of target platform.
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -o "dist/dockvista-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/dockvista
      - uses: actions/upload-artifact@v4
        with:
          name: dockvista-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
